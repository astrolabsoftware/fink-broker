# Default values for chart.
# These values are used for fink-broker e2e tests

# Default night of the WorkflowTemplate, run by e2e/catchup.sh without -n (CI).
# Not set with nightly.enabled, so that a catch-up has to name its night.
night: "20240101"

# Nightly run: a CronWorkflow submitting the WorkflowTemplate every day, on
# today's night (UTC), processed live as its alerts arrive. Disabled -> no
# Spark job runs by itself: each night is submitted by hand (e2e/catchup.sh,
# CI). Every time in this block is UTC.
nightly:
  enabled: false
  schedule: "1 0 * * *"
  # Time of day (HH:MM, UTC) at which the run stops, on the day of its night:
  # an absolute deadline, computed once by the guard step, so a restarted job
  # aims at the same instant. Alerts arriving later are recovered by a
  # catch-up of the night.
  exitAt: "20:00"
  # Forbid a new run while the previous one is still active; the per-night
  # mutex of the WorkflowTemplate already keeps a catch-up of the same night
  # away.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Hour (UTC), on the day after a night, from which the night can be caught up:
# its late alerts are in, and the nightly run, which processes today's night,
# can no longer write the same checkpoints. Only read by the guard of the
# catch-ups.
nightCloseHour: 10

image:
  pullPolicy: IfNotPresent
  repository: gitlab-registry.in2p3.fr/astrolabsoftware/fink
  name: fink-broker
  tag: "v3.1.2-rc1-26-g6b2404a"

# Can be overriden in stream2raw, raw2science and distribution sections
cores: 1
coreRequest: 0
instances: 1
memory: "1000m"
# instances: 1

fink_trigger_update: "2"

# Can be overriden using --image option

# Default to s3a://<s3.bucket>
online_data_prefix: hdfs://simple-hdfs-namenode-default-0.simple-hdfs-namenode-default.hdfs:8020///user/185
producer: ztf

log_level: INFO

monitoring:
  # Add JMX exporter to spark pods and create a PodMonitor
  enabled: false

#
# Daily diagnostic reporting what entered and what left the broker for each
# observing night: alerts consumed from the survey Kafka cluster, size of the
# raw and science datasets, messages pushed to each distribution topic. The
# report is written to the pod stdout (kubectl logs).
#
# Only makes sense with nightly.enabled and storage=hdfs: it reads the
# datasets from the NameNode(s) given by report.namenode, and attributes
# distributed messages to a night using the run window deduced from
# nightly.schedule.
#
# WorkflowTemplate <fullname>-night, the only way a night is run (Argo
# Workflows must be installed in the cluster): by the nightly CronWorkflow, or
# by hand to catch a night up from the checkpoints of the nightly run:
#   e2e/catchup.sh -n YYYYMMDD
# A guard step refuses a night that cannot be run in that mode (a catch-up
# needs a closed night, see nightCloseHour; a nightly run, today's night), then
# the three jobs run with an absolute deadline.
workflows:
  # Runs the guard: needs bash and date.
  guardImage: "bash:5.2"
  # Deadline of a catch-up, in hours after its guard step started.
  deadlineHours: 18

report:
  enabled: false
  # NameNode RPC address(es) the report reads HDFS from, host:port[,host:port].
  # List every namenode of an HA pair, so the report follows the active one.
  # Empty -> the host:port of online_data_prefix.
  namenode: ""
  # Fires once the streaming jobs of the nightly run have stopped, at
  # nightly.exitAt.
  schedule: "0 7 * * *"
  # A CronJob retains a number of jobs, not a duration: with a daily schedule,
  # 7 successful runs is a week of reports readable with kubectl logs.
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  image:
    repository: gitlab-registry.in2p3.fr/astrolabsoftware/fink
    name: finkctl
    # Built and published from the finkctl repository (build.sh, push-image.sh)
    tag: "v3.1.3-rc6"
    pullPolicy: IfNotPresent
  serviceAccount:
    name: fink-report

#
# Parameters used to run the stream2raw task
#
stream2raw:
  cores: "{{.Values.cores}}"
  coreRequest: "{{.Values.coreRequest}}"
  memory: "{{.Values.memory}}"
  instances: "{{.Values.instances}}"
  fink_alert_schema: /home/fink/fink-alert-schemas/ztf/datasim_basic_alerts_all_distribute_topics.avro
  kafka:
    in_sockets: kafka-cluster-kafka-bootstrap.kafka:9092
    starting_offset: earliest
    # {night} is a runtime placeholder resolved by the job (get_night), not by
    # Helm: it works for both a pinned and a deduced night.
    topic: "ztf_public_{night}"

#
# Parameters used to run the raw2science task
#
raw2science:
  # driver and executor are sized/placed independently so a big executor can
  # run on a dedicated node pool while the driver stays small on the general
  # pool. Values default to the global cores/coreRequest/memory/instances.
  driver:
    cores: "{{.Values.cores}}"
    coreRequest: "{{.Values.coreRequest}}"
    memory: "{{.Values.memory}}"
    nodeSelector: {}
    tolerations: []
  executor:
    cores: "{{.Values.cores}}"
    coreRequest: "{{.Values.coreRequest}}"
    memory: "{{.Values.memory}}"
    # Off-heap memory of the executor pod (Python workers of the science
    # modules, one per core). Empty -> Spark default, 40% of memory here.
    memoryOverhead: ""
    instances: "{{.Values.instances}}"
    nodeSelector: {}
    tolerations: []

#
# Parameters used to run the distribution task
#
distribution:
  cores: "{{.Values.cores}}"
  coreRequest: "{{.Values.coreRequest}}"
  memory: "{{.Values.memory}}"
  instances: "{{.Values.instances}}"
  kafka:
    out_sockets: "kafka-cluster-kafka-external-bootstrap.kafka:9094"
    substream_prefix: "fink_"
    kafka_security_protocol: "SASL_PLAINTEXT"


storage: hdfs

#
# Parameters used to access the S3 bucket
#
s3:
  endpoint: https://minio.minio:443
  use_ssl: "true"
  # {night} is a runtime placeholder resolved by the job (get_night), not by
  # Helm: it works for both a pinned and a deduced night.
  bucket: "fink-broker-online-{night}"
  access_key: "minio"
  secret_key: "minio123"

hdfs:
  hadoop_user_name: "185"
  # false -> the Stackable HDFS deployed in the cluster: the chart creates the
  #          user directory through its namenode (job-hdfs-init).
  # true  -> an HDFS outside the cluster, reached through online_data_prefix:
  #          the user directory is provisioned by its admins.
  # The report reads HDFS the same way in both cases (report.namenode).
  external: false
  # Replication of the files the Spark jobs write. HDFS clients do not inherit
  # it from the cluster: set it to the dfs.replication of the cluster.
  # Empty -> the Hadoop client default (3).
  replication: ""

# Extra /etc/hosts entries of the Spark and report pods, as a list of
# Kubernetes HostAlias ({ip, hostnames}). Used to resolve the hosts of an HDFS
# outside the cluster whose names are not in the cluster DNS. Site-specific,
# keep the addresses out of git (see doc/deploy-cc.md).
hostAliases: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "spark"

podAnnotations: {}
podLabels: {}


# Default values for chart.
# These values are used for fink-broker e2e tests

# Pinned night used in run.mode=oneoff (backfill, rerun, CI). Ignored in
# run.mode=scheduled, where the night is deduced at runtime (see scheduled).
night: "20240101"

run:
  # oneoff    -> 3 SparkApplication with a pinned -night (backfill / rerun / CI,
  #              imperative, applied on demand out of ArgoCD).
  # scheduled -> 3 ScheduledSparkApplication deducing the night at runtime
  #              (permanent daily production run, managed by ArgoCD).
  mode: oneoff

# Only used when run.mode=scheduled.
scheduled:
  # Single cron shared by the three jobs so they fire together and agree on the
  # same night (same side of the UTC boundary). UTC.
  schedule: "0 12 * * *"
  # Forbid a new run while the previous one is still active (a streaming run may
  # overrun its window).
  concurrencyPolicy: Forbid
  successfulRunHistoryLimit: 3
  failedRunHistoryLimit: 3
  # Hours subtracted from UTC now to deduce the night (see get_night):
  # 0 -> current night (live), 24 -> previous complete night (n-1). To settle
  # against the ZTF topic rollover convention.
  nightOffsetHours: 24

# Stop each streaming run after this many seconds. Applies to both run modes
# (a scheduled run must terminate before the next tick; a backfill must
# terminate once the night is replayed). Sized to a night; matches the job
# default (64800 = 18h). Override per environment (e.g. values-cc.yaml).
exitAfter: 64800

image:
  pullPolicy: IfNotPresent
  repository: gitlab-registry.in2p3.fr/astrolabsoftware/fink
  name: fink-broker
  tag: "v3.1.2-rc1-26-g6b2404a"

# Can be overriden in stream2raw, raw2science and distribution sections
cores: 1
coreRequest: 0
instances: 1
memory: "1000m"
# instances: 1

fink_trigger_update: "2"

# Can be overriden using --image option

# Default to s3a://<s3.bucket>
online_data_prefix: hdfs://simple-hdfs-namenode-default-0.simple-hdfs-namenode-default.hdfs:8020///user/185
producer: ztf

log_level: INFO

monitoring:
  # Add JMX exporter to spark pods and create a PodMonitor
  enabled: false

#
# Parameters used to run the stream2raw task
#
stream2raw:
  cores: "{{.Values.cores}}"
  coreRequest: "{{.Values.coreRequest}}"
  memory: "{{.Values.memory}}"
  instances: "{{.Values.instances}}"
  fink_alert_schema: /home/fink/fink-alert-schemas/ztf/datasim_basic_alerts_all_distribute_topics.avro
  kafka:
    in_sockets: kafka-cluster-kafka-bootstrap.kafka:9092
    starting_offset: earliest
    # {night} is a runtime placeholder resolved by the job (get_night), not by
    # Helm: it works for both a pinned and a deduced night.
    topic: "ztf_public_{night}"

#
# Parameters used to run the raw2science task
#
raw2science:
  # driver and executor are sized/placed independently so a big executor can
  # run on a dedicated node pool while the driver stays small on the general
  # pool. Values default to the global cores/coreRequest/memory/instances.
  driver:
    cores: "{{.Values.cores}}"
    coreRequest: "{{.Values.coreRequest}}"
    memory: "{{.Values.memory}}"
    nodeSelector: {}
    tolerations: []
  executor:
    cores: "{{.Values.cores}}"
    coreRequest: "{{.Values.coreRequest}}"
    memory: "{{.Values.memory}}"
    instances: "{{.Values.instances}}"
    nodeSelector: {}
    tolerations: []

#
# Parameters used to run the distribution task
#
distribution:
  cores: "{{.Values.cores}}"
  coreRequest: "{{.Values.coreRequest}}"
  memory: "{{.Values.memory}}"
  instances: "{{.Values.instances}}"
  kafka:
    out_sockets: "kafka-cluster-kafka-external-bootstrap.kafka:9094"
    substream_prefix: "fink_"
    kafka_security_protocol: "SASL_PLAINTEXT"


storage: hdfs

#
# Parameters used to access the S3 bucket
#
s3:
  endpoint: https://minio.minio:443
  use_ssl: "true"
  # {night} is a runtime placeholder resolved by the job (get_night), not by
  # Helm: it works for both a pinned and a deduced night.
  bucket: "fink-broker-online-{night}"
  access_key: "minio"
  secret_key: "minio123"

hdfs:
  hadoop_user_name: "185"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "spark"

podAnnotations: {}
podLabels: {}


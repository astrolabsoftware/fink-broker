{{- if and .Values.report.enabled (eq .Values.storage "hdfs") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.report.serviceAccount.name }}
  labels:
    {{- include "fink.labels" . | nindent 4 }}
{{- range $namespace := list "kafka" "hdfs" }}
---
# The report runs the kafka and hdfs CLIs inside the pods of those two stacks,
# as finkctl does elsewhere: it needs to locate the pod, then to open an exec
# session. Rights are granted namespace by namespace, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fink-report
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fink-report
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fink-report
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.report.serviceAccount.name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}

---
# A semver tag is what consumers pin, and what ciux and `git describe` resolve
# to name a released artifact. A tag sitting on a branch that is later rebased,
# squashed or deleted points at a commit reachable from nothing, and the
# release can no longer be traced back to a released state.
#
# Deliberately a workflow of its own, triggered by tags only: it cannot affect
# any branch push, any pull request, or any existing job.
name: "Tag placement"
on:
  push:
    tags:
      - '*'

jobs:
  check-tag:
    name: Semver tag must be on the default branch
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: merge-base needs the history of both refs
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check where the tag sits
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Only releases are checked; a scratch tag is nobody's business
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "$TAG is not a semver tag, nothing to check"
            exit 0
          fi

          git fetch --quiet origin "$DEFAULT_BRANCH"
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "$TAG is on $DEFAULT_BRANCH"
            exit 0
          fi

          echo "::error title=Tag off the default branch::$TAG points at a commit which is not on $DEFAULT_BRANCH"
          echo "$TAG points at $(git log -1 --format='%h %s' "$GITHUB_SHA")," >&2
          echo "which is not on $DEFAULT_BRANCH." >&2
          echo "" >&2
          echo "Delete the tag, merge the branch, then tag from $DEFAULT_BRANCH:" >&2
          echo "  git push --delete origin $TAG && git tag -d $TAG" >&2
          echo "  git checkout $DEFAULT_BRANCH && git pull --ff-only" >&2
          echo "  git tag -m 'Release $TAG' $TAG && git push --tag" >&2
          exit 1

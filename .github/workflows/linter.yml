name: PEP8

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.11]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    - name: fink-broker
      run: |
        ruff check --statistics fink_broker/*/*.py
        ruff format --check fink_broker/*/*.py
    - name: bin
      run: |
        ruff check --statistics bin/*/*.py
        ruff format --check bin/*/*.py

  helm-render:
    # Renders the fink-cd app-of-apps and the fink-broker chart, and checks
    # which components each storage/HDFS/Kafka switch deploys (no cluster).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - name: Check the rendered manifests
      run: e2e/check-helm-render.sh
